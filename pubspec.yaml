name: pm1_tugas1
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

assets:
    - assets/images/

fonts:
    - family: Urbanist
      fonts:
        - assets: assets/fonts/Urbanist-Regular.ttf
        - assets: assets/fonts/Urbanist-Thin.ttf
          weight: 100
        - assets: assets/fonts/Urbanist-Medium.ttf
          weight: 300
        - assets: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - assets: assets/fonts/Urbanist-Bold.ttf
          weight: 800
        - assets: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 900
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
